taskname: "+ Esophagus ROI SuPreM Swin UNETR"
common:
  run_label: "train_swinunetr"
  log_freq: 10
  auto_resume: true
  mixed_precision: true
  channels_last: false
  tensorboard_logging: false
dataset:
  root_train: ""
  root_val: ""
  root_test: ""
  name: "esophagus_risk_roi_3d"
  category: "classification"
  train_batch_size0: 1
  val_batch_size0: 1
  eval_batch_size0: 1
  workers: 4
  persistent_workers: false
  pin_memory: true
  prefetch_factor: 2
  esophagus_roi_3d:
    label_id: 15
    input_depth: 128
    input_height: 160
    input_width: 160
    roi_margin_xy: 0
    roi_margin_z: 0
    inferior_to_superior_height_mm: 40.0
    val_split_ratio: 0.2
    split_seed: 42
    use_windowing: true
    window_center: 50.0
    window_width: 350.0
    clip_percentile_lower: 0.5
    clip_percentile_upper: 99.5
sampler:
  name: "batch_sampler"
  bs:
    crop_size_width: 160
    crop_size_height: 160
loss:
  category: "classification"
  classification:
    name: "cross_entropy"
    cross_entropy:
      label_smoothing: 0.0
optim:
  name: "adamw"
  weight_decay: 1.0e-5
  no_decay_bn_filter_bias: true
  adamw:
    beta1: 0.9
    beta2: 0.999
scheduler:
  name: "cosine"
  is_iteration_based: false
  max_epochs: 300
  warmup_iterations: 100
  warmup_init_lr: 1.0e-6
  cosine:
    max_lr: 1.0e-4
    min_lr: 1.0e-6
model:
  classification:
    name: "suprem_swinunetr_roi"
    classifier_dropout: 0.2
    suprem_swinunetr_roi:
      pretrained_path: ""
      require_pretrained: true
      feature_size: 48
      use_checkpoint: false
    activation:
      name: "relu"
      inplace: true
  normalization:
    name: "batch_norm"
    momentum: 0.1
  activation:
    name: "relu"
    inplace: true
  layer:
    global_pool: "mean"
    conv_init: "kaiming_normal"
    linear_init: "normal"
ema:
  enable: false
stats:
  val: ["loss", "top1"]
  train: ["loss"]
  checkpoint_metric: "top1"
  checkpoint_metric_max: true
