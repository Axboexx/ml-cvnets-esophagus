taskname: "+ G4 Multi-Organ Clinical Fusion"
common:
  log_freq: 10
  auto_resume: true
  mixed_precision: true
  channels_last: false
  tensorboard_logging: false
dataset:
  root_train: ""
  root_val: ""
  root_test: ""
  name: "esophagus_risk_g4_clinical_roi_3d"
  category: "classification"
  train_batch_size0: 4
  val_batch_size0: 4
  eval_batch_size0: 4
  workers: 4
  persistent_workers: false
  pin_memory: true
  prefetch_factor: 2
  esophagus_g4:
    clinical_workbook: ""
  e3a_multi_organ_roi_3d:
    organ_names: "esophagus,liver"
    label_ids: "15,5"
    input_depth: 128
    input_height: 160
    input_width: 160
    roi_margin_xy: "0,0"
    roi_margin_z: "0,0"
    esophagus_inferior_to_superior_height_mm: 40.0
    min_esophagus_height_mm: 40.0
    required_organs: "esophagus"
    val_split_ratio: 0.2
    split_seed: 42
    use_windowing: true
    window_center: 50.0
    window_width: 350.0
    clip_percentile_lower: 0.5
    clip_percentile_upper: 99.5
sampler:
  name: "batch_sampler"
  bs:
    crop_size_width: 160
    crop_size_height: 160
loss:
  category: "classification"
  classification:
    name: "cross_entropy"
    cross_entropy:
      label_smoothing: 0.0
optim:
  name: "adamw"
  weight_decay: 1.0e-5
  no_decay_bn_filter_bias: true
  adamw:
    beta1: 0.9
    beta2: 0.999
scheduler:
  name: "cosine"
  is_iteration_based: false
  max_epochs: 120
  warmup_iterations: 100
  warmup_init_lr: 1.0e-6
  cosine:
    max_lr: 1.0e-4
    min_lr: 1.0e-6
model:
  classification:
    name: "suprem_unet_g4_clinical_context"
    classifier_dropout: 0.2
    suprem_unet_e3a_residual_context:
      pretrained_path: ""
      require_pretrained: true
      num_organs: 2
      input_channels_per_organ: 1
      context_scale: 1.0
    suprem_unet_g4_clinical_context:
      num_clinical_features: 17
      clinical_hidden_dim: 32
      clinical_embedding_dim: 16
      clinical_dropout: 0.2
    activation:
      name: "relu"
      inplace: true
  normalization:
    name: "batch_norm"
    momentum: 0.1
  activation:
    name: "relu"
    inplace: true
  layer:
    global_pool: "mean"
    conv_init: "kaiming_normal"
    linear_init: "normal"
ema:
  enable: false
stats:
  val: ["loss", "top1"]
  train: ["loss", "top1"]
  checkpoint_metric: "top1"
  checkpoint_metric_max: true
