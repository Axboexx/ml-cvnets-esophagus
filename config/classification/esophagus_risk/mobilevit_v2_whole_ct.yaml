taskname: "+ Esophagus Risk MobileViTv2 Whole CT"
common:
  run_label: "train"
  log_freq: 10
  auto_resume: false
  mixed_precision: true
  channels_last: true
  tensorboard_logging: false
dataset:
  root_train: ""
  root_val: ""
  name: "esophagus_risk_png"
  category: "classification"
  train_batch_size0: 16
  val_batch_size0: 16
  eval_batch_size0: 16
  workers: 4
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: true
image_augmentation:
  random_resized_crop:
    enable: true
    interpolation: "bicubic"
  random_horizontal_flip:
    enable: true
  rand_augment:
    enable: false
  random_erase:
    enable: false
  mixup:
    enable: false
  cutmix:
    enable: false
  resize:
    enable: true
    size: 288
    interpolation: "bicubic"
  center_crop:
    enable: true
    size: 256
sampler:
  name: "batch_sampler"
  bs:
    crop_size_width: 256
    crop_size_height: 256
loss:
  category: "classification"
  classification:
    name: "cross_entropy"
    cross_entropy:
      label_smoothing: 0.0
optim:
  name: "adamw"
  weight_decay: 0.05
  no_decay_bn_filter_bias: true
  adamw:
    beta1: 0.9
    beta2: 0.999
scheduler:
  name: "cosine"
  is_iteration_based: false
  max_epochs: 50
  warmup_iterations: 100
  warmup_init_lr: 1.0e-6
  cosine:
    max_lr: 0.0005
    min_lr: 1.0e-5
model:
  classification:
    name: "mobilevit_v2"
    mitv2:
      width_multiplier: 1.0
      attn_norm_layer: "layer_norm_2d"
    activation:
      name: "swish"
  normalization:
    name: "batch_norm"
    momentum: 0.1
  activation:
    name: "swish"
  layer:
    global_pool: "mean"
    conv_init: "kaiming_normal"
    conv_init_std_dev: 0.02
    linear_init: "trunc_normal"
    linear_init_std_dev: 0.02
ema:
  enable: false
stats:
  val: ["loss", "top1"]
  train: ["loss"]
  checkpoint_metric: "top1"
  checkpoint_metric_max: true
